{% extends 'bakery/base.html' %}

{% block title %}Special Order{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Special Order Form</h3>
                </div>
                <div class="card-body">
                    <p>Make a list of the items you want to have ready and place it here on this form.</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label>Your Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label>Email *</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label>Phone Number *</label>
                            <input type="tel" name="phone" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label>Delivery Option *</label>
                            <select name="delivery_option" class="form-control" required>
                                <option value="delivery">Delivery</option>
                                <option value="pickup">Pickup</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label>Address</label>
                            <textarea name="address" class="form-control" rows="2" placeholder="Street Address"></textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label>City</label>
                                    <input type="text" name="city" class="form-control">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label>Zip Code</label>
                                    <input type="text" name="zip_code" class="form-control">
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label>Items You Want *</label>
                            <textarea name="items_requested" class="form-control" rows="5" placeholder="Example: 2 dozen chocolate chip cookies, 1 custom birthday cake (chocolate with vanilla frosting, 'Happy Birthday' written), 6 croissants..." required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">Submit Special Order →</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
